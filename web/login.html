<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Accedi — iLO2 Console</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12; --surface: #12151c; --surface-2: #181c26; --border: #232838;
    --text: #e7eaf0; --text-dim: #8a91a3; --accent: #3ea6ff; --crit: #f0546a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  form {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); font-size: 12.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); margin: 14px 0 6px; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 10px 12px; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; background: var(--accent); color: #06141f;
    border: none; border-radius: 9px; padding: 11px; font-size: 14px; font-weight: 600;
    cursor: pointer; min-height: 44px;
  }
  button:active { opacity: .85; }
  .error {
    background: rgba(240,84,106,.12); border: 1px solid var(--crit); color: var(--crit);
    border-radius: 9px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 4px;
  }
</style>
</head>
<body>
<form method="POST" action="/api/login">
  <h1>iLO2 Console</h1>
  <p class="sub">Accesso richiesto per continuare</p>
  <div class="error" id="errorBox" style="display:none">Credenziali non valide, riprova.</div>
  <label for="user">Utente</label>
  <input id="user" name="user" autocomplete="username" autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Accedi</button>
</form>
<script>
  if (new URLSearchParams(location.search).get('error') === '1') {
    document.getElementById('errorBox').style.display = 'block';
  }
</script>
</body>
</html>
